<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Naruto</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div id="tela-inicial">
            <h1>Bem-vindo à Vila da Folha!</h1>
            <h2>Este sistema encontrará o personagem perfeito do universo de Naruto que mais combina com você!</h2>
            <p>Responda com sinceridade a um questionário de 10 perguntas.</p>
            <button id="btn-comecar">Começar Questionário</button>
        </div>

        <div id="tela-quiz" class="hidden">
            <h2 id="texto-pergunta">Pergunta vai aqui...</h2>
            <div id="container-opcoes" class="options-container"></div>
            <button id="btn-proximo" disabled>Próxima Pergunta</button>
        </div>

        <div id="tela-resultado" class="hidden">
            <h1>Seu Personagem é...</h1>
            <h2 id="nome-personagem">Nome</h2>
            <img id="imagem-personagem" class="result-image" src="">
            <p id="descricao-personagem"></p>
            <p><strong>Pontuação: <span id="pontos-personagem">0</span></strong></p>
            <button id="btn-reiniciar">Refazer Questionário</button>
        </div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
